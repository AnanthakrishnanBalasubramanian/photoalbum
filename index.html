<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A beautiful gallery of positive vocabulary infographics - words that inspire, motivate, and uplift.">
    <meta name="keywords" content="positive vocabulary, positive words, motivation, inspiration, infographics">
    <title>Words That Spark Joy ✨ | Positive Vocabulary Gallery</title>
    <link rel="stylesheet" href="styles.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">✨</span>
                <h1>Words That Spark Joy</h1>
            </div>
            <div class="header-controls">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search words..."
                        aria-label="Search vocabulary words">
                    <span class="search-icon">🔍</span>
                </div>
                <button id="slideshowBtn" class="btn btn-primary" aria-label="Start slideshow">
                    <span class="btn-icon">▶</span>
                    <span class="btn-text">Slideshow</span>
                </button>
                <button id="shuffleBtn" class="btn btn-secondary" aria-label="Shuffle gallery">
                    <span class="btn-icon">🔀</span>
                    <span class="btn-text">Shuffle</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stats-content">
            <div class="stat-item">
                <span class="stat-value" id="totalCount">0</span>
                <span class="stat-label">Total Items</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="imageCount">0</span>
                <span class="stat-label">Images</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="videoCount">0</span>
                <span class="stat-label">Videos</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="visibleCount">0</span>
                <span class="stat-label">Showing</span>
            </div>
        </div>
    </div>

    <!-- Main Gallery -->
    <main class="gallery-container">
        <div id="gallery" class="gallery-grid">
            <!-- Gallery items will be dynamically inserted here -->
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading-state">
            <div class="loader"></div>
            <p>Loading gallery...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state hidden">
            <span class="empty-icon">🔍</span>
            <h2>No results found</h2>
            <p>Try a different search term</p>
        </div>
    </main>

    <!-- Slideshow Modal -->
    <div id="slideshowModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Slideshow viewer">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <!-- Close Button -->
            <button id="closeSlideshow" class="modal-close" aria-label="Close slideshow">
                <span>×</span>
            </button>

            <!-- Navigation -->
            <button id="prevSlide" class="nav-btn nav-prev" aria-label="Previous slide">
                <span>‹</span>
            </button>
            <button id="nextSlide" class="nav-btn nav-next" aria-label="Next slide">
                <span>›</span>
            </button>

            <!-- Media Container -->
            <div class="slideshow-media">
                <img id="slideshowImage" class="slideshow-img hidden" alt="Slideshow image">
                <video id="slideshowVideo" class="slideshow-video hidden" controls>
                    <source id="slideshowVideoSource" src="" type="video/mp4">
                </video>
            </div>

            <!-- Info Panel -->
            <div class="slideshow-info">
                <div class="slideshow-counter">
                    <span id="currentSlide">1</span> / <span id="totalSlides">0</span>
                </div>
                <div class="slideshow-words" id="slideshowWords"></div>
                <div class="slideshow-controls">
                    <button id="autoplayBtn" class="btn btn-small" aria-label="Toggle autoplay">
                        <span id="autoplayIcon">▶</span>
                        <span id="autoplayText">Auto</span>
                    </button>
                    <div class="speed-control">
                        <label for="speedSelect">Speed:</label>
                        <select id="speedSelect">
                            <option value="2000">2s</option>
                            <option value="3000" selected>3s</option>
                            <option value="5000">5s</option>
                            <option value="8000">8s</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <a href="https://www.instagram.com/Ak.krishna" target="_blank" rel="noopener noreferrer"
                class="social-link instagram-link" aria-label="Instagram Profile">
                <svg class="social-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z" />
                </svg>
                <span>@Ak.krishna</span>
            </a>
            <div class="footer-brand">
                <span class="brand-text">AI AK</span>
                <p class="footer-tagline">Made with 💜 • <span id="generatedDate">-</span></p>
            </div>
            <a href="https://www.linkedin.com/in/ananthakrishnanbalasubramanian" target="_blank"
                rel="noopener noreferrer" class="social-link linkedin-link" aria-label="LinkedIn Profile">
                <svg class="social-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                </svg>
                <span>Ak</span>
            </a>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
